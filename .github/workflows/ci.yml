name: Memory checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory-test
          POSTGRES_DB: memory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...
      - run: go test -race -tags integration ./...
        env:
          MEMORY_TEST_DATABASE_URL: postgres://memory:memory-test@127.0.0.1:5432/memory_test?sslmode=disable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build
        working-directory: web
